<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELO · Importación de respaldo</title>
  <style>
    body { margin: 0; background: #161622; color: #f8f8f8; font: 16px/1.6 Arial, sans-serif; }
    main { max-width: 680px; margin: 48px auto; padding: 24px; background: #242438; border-radius: 14px; }
    h1 { color: #ffca43; }
    button { padding: 12px 18px; margin: 6px 8px 6px 0; border: 0; border-radius: 7px; font-weight: bold; cursor: pointer; }
    button:disabled { cursor: default; opacity: .5; }
    #estado { white-space: pre-wrap; }
    .aviso { color: #fce39b; }
    a { color: #a4d4ff; }
  </style>
</head>
<body>
  <main>
    <h1>Importación controlada de ELO</h1>
    <p>Primero analiza el catálogo original. Solo después podrás importar. La página pública no se modifica.</p>
    <p class="aviso">Requiere una sesión de administradora de <a href="./">ELO Admin</a>. Ejecuta la importación una sola vez. No elimines productos existentes.</p>
    <button id="analizar" type="button">1. Analizar sin importar</button>
    <button id="importar" type="button" disabled>2. Importar 198 productos</button>
    <p id="estado" role="status">No se ha realizado ningún cambio.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const cliente = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const analizar = document.getElementById("analizar");
    const importar = document.getElementById("importar");
    const estado = document.getElementById("estado");
    let registros = null;
    let ocupado = false;

    function mostrar(mensaje) { estado.textContent = mensaje; }

    async function revisarAcceso() {
      const { data: auth, error: authError } = await cliente.auth.getUser();
      if (authError || !auth.user) {
        throw new Error("No hay sesión. Inicia sesión en ELO Admin, regresa y analiza de nuevo.");
      }
      const { data: admin, error: adminError } = await cliente
        .from("administradores")
        .select("usuario_id")
        .eq("usuario_id", auth.user.id)
        .maybeSingle();
      if (adminError) throw new Error("No se pudieron consultar permisos: " + adminError.message);
      if (!admin) throw new Error("Esta cuenta no tiene permisos de administración.");
    }

    async function comprobarColisiones(items) {
      const ids = items.map(item => item.id);
      const { data, error } = await cliente
        .from("productos")
        .select("id")
        .in("id", ids);
      if (error) throw new Error("Error comprobando IDs existentes: " + error.message);
      if (data.length > 0) {
        throw new Error(
          "Se detectaron " + data.length + " IDs ya existentes entre los productos originales. " +
          "No se importó nada para evitar sobrescrituras o duplicados."
        );
      }
    }

    async function prepararDatos() {
      const respuesta = await fetch("../index.html", { cache: "no-store" });
      if (!respuesta.ok) throw new Error("No se pudo leer el index.html original.");
      const html = await respuesta.text();

      const bloqueProductos = html.match(/const products\s*=\s*(\[[^\r\n]*\]);/);
      const bloquePrecios = html.match(/const precios\s*=\s*\{([\s\S]*?)\};/);
      if (!bloqueProductos || !bloquePrecios) {
        throw new Error("El formato del catálogo original cambió. No se importó nada.");
      }

      const originales = JSON.parse(bloqueProductos[1]);
      if (!Array.isArray(originales) || originales.length !== 198) {
        throw new Error("Se esperaban 198 productos; se encontraron " + originales.length + ".");
      }

      const precios = {};
      const patron = /^\s*(?:\/\*.*?\*\/\s*)?(\d+)\s*:\s*(null|\d+(?:\.\d+)?)\s*,?\s*$/gm;
      for (const encontrado of bloquePrecios[1].matchAll(patron)) {
        precios[encontrado[1]] =
          encontrado[2] === "null" ? null : Number(encontrado[2]);
      }

      const raizImagenes = new URL("../", location.href);
      const items = originales.map(p => ({
        id: Number(p.id),
        nombre: p.name,
        descripcion: p.description || "",
        precio: precios[p.id] ?? null,
        categoria: p.category,
        imagen: p.image ? new URL(p.image, raizImagenes).href : null,
        tiros: p.shots ?? null,
        video: p.video || null,
        categoria_etiqueta: p.categoryLabel || null,
        simbolo: p.symbol || null,
        activo: true
      }));

      const ids = items.map(p => p.id);
      if (ids.some(id => !Number.isSafeInteger(id) || id <= 0) || new Set(ids).size !== 198) {
        throw new Error("Hay identificadores inválidos o repetidos en el catálogo original.");
      }
      return items;
    }

    analizar.addEventListener("click", async () => {
      if (ocupado) return;
      ocupado = true;
      analizar.disabled = true;
      importar.disabled = true;
      registros = null;
      try {
        mostrar("Comprobando sesión y catálogo...");
        await revisarAcceso();
        const items = await prepararDatos();
        await comprobarColisiones(items);
        registros = items;
        const conPrecio = items.filter(p => p.precio !== null).length;
        mostrar("Análisis correcto.\n198 productos, IDs únicos, 0 colisiones.\n" +
          conPrecio + " con precio numérico; " + (198 - conPrecio) + " sin precio.\n" +
          "No se ha guardado nada. Si los datos son correctos, puedes importar.");
        importar.disabled = false;
      } catch (error) {
        mostrar("No se realizó ningún cambio.\n" + error.message);
      } finally {
        analizar.disabled = false;
        ocupado = false;
      }
    });

    importar.addEventListener("click", async () => {
      if (ocupado || !registros) return;
      if (!confirm("¿Importar 198 productos originales a Supabase? No se alterará el catálogo público.")) return;
      ocupado = true;
      analizar.disabled = true;
      importar.disabled = true;
      try {
        mostrar("Comprobando permisos y duplicados por última vez...");
        await revisarAcceso();
        await comprobarColisiones(registros);
        mostrar("Guardando 198 registros. No cierres esta pestaña.");
        const { error } = await cliente.from("productos").insert(registros);
        if (error) throw new Error(error.message);
        registros = null;
        mostrar("¡Importación enviada correctamente!\nVerifica en Supabase los 198 registros originales. " +
          "No vuelvas a importar.\nEl catálogo público aún no se ha conectado a Supabase.");
      } catch (error) {
        mostrar("No se pudo completar la importación:\n" + error.message +
          "\nAntes de repetir, comprueba cuántos registros aparecen en Supabase.");
      } finally {
        analizar.disabled = false;
        ocupado = false;
      }
    });
  </script>
</body>
</html>
