
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración ELO</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #151515;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .contenedor {
            background: #242424;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            max-width: 85%;
            text-align: center;
        }

        h1 {
            color: #ffbf00;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
            border-radius: 6px;
        }

        input {
            border: 1px solid #555;
            background: #333;
            color: white;
        }

        button {
            border: none;
            background: #ffbf00;
            font-weight: bold;
            cursor: pointer;
        }

        #mensaje {
            color: #ff7777;
        }

        #panel {
            display: none;
        }
    </style>
</head>
<body>

    <div class="contenedor" id="login">
        <h1>ELO Admin</h1>
        <p>Iniciar sesión</p>

        <form id="formLogin">
            <input type="email" id="correo"
                   placeholder="Correo electrónico" required>

            <input type="password" id="contrasena"
                   placeholder="Contraseña" required>

            <button type="submit">Ingresar</button>
        </form>

        <p id="mensaje"></p>
    </div>

<div class="contenedor" id="recuperacion" style="display: none;">
    <h1>Nueva contraseña</h1>
    <p>Escribe tu nueva contraseña para ELO.</p>

    <form id="formRecuperacion">
        <input type="password"
               id="nuevaContrasena"
               placeholder="Nueva contraseña"
               minlength="8"
               required>

        <button type="submit">
            Guardar contraseña
        </button>
    </form>

    <p id="mensajeRecuperacion"></p>
</div>

    <div class="contenedor" id="panel">
        <h1>Panel ELO</h1>
        <p>Bienvenida, administradora.</p>

<p>Acceso autorizado.</p>

<h2>Administrar productos</h2>

<button id="actualizarProductos">
    Actualizar lista
</button>

<p id="mensajeProductos"></p>

<h2>Agregar producto</h2>

<form id="formProducto">
    <input
        type="text"
        id="nombreProducto"
        placeholder="Nombre del producto"
        required
    >

    <input
        type="number"
        id="precioProducto"
        placeholder="Precio"
        min="0"
        step="0.01"
    >

    <input
        type="text"
        id="categoriaProducto"
        placeholder="Categoría"
    >

<label for="imagenProducto">
    Fotografía del producto
</label>

<input
    type="file"
    id="imagenProducto"
    accept="image/jpeg,image/png,image/webp"
>

<p id="vistaImagen"></p>

    <button type="submit">
        Guardar producto
    </button>
</form>

<p id="mensajeGuardar"></p>

<div id="seccionEditar" style="display: none;">
    <h2>Editar producto</h2>

    <form id="formEditar">
        <input type="hidden" id="editarId">

        <input
            type="text"
            id="editarNombre"
            placeholder="Nombre"
            required
        >

        <input
            type="number"
            id="editarPrecio"
            placeholder="Precio"
            min="0"
            step="0.01"
        >

        <input
            type="text"
            id="editarCategoria"
            placeholder="Categoría"
        >

        <button type="submit">
            Guardar cambios
        </button>

        <button type="button" id="cancelarEdicion">
            Cancelar
        </button>
    </form>

    <p id="mensajeEditar"></p>
</div>

<div id="listaProductos"></div>

<button id="salir">Cerrar sesión</button>

    </div>

   
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=4"></script>
<script src="admin.js?v=15"></script>


</body>
</html>
